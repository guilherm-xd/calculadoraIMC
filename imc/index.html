<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="painel">
        <h1>Calculadora de IMC</h1>
        <form id="formIMC">
            <label>Insira o seu nome:</label>
            <br>
            <input id="nomeValor" type="text" placeholder="Exemplo: Carlos" required>
            <br>
            <br>
            <label>Insira sua altura (m):</label>
            <br>
            <input id="alturaValor" type="number" placeholder="Exemplo: 1,75" step="any" required>
            <br>
            <br>
            <label>Insira seu peso (kg):</label>
            <br>
            <input id="pesoValor" type="number" placeholder="Exemplo: 55" step="any" required>
            <br>
            <br>
            <button id="botaoCalcular">Calcular</button>
            <button id="botaoLimpar" type="button">Limpar</button>
        </form>
        <br>
        <h3 id="valorIMC"></h3>
        <h3 id="situacaoIMC"></h3>
    </div>
    <div class="painel" id="divCadastro">
        <h1>Pessoas cadastradas</h1>
        <h3 id="quantidadePessoas"></h3>

        <section class="resumo">
            <h2>Resumo</h2>
            <dl>
                <div class="resumo-item">
                    <dt>Média de peso</dt>
                    <dd id="mediaPeso">-</dd>
                </div>
                <div class="resumo-item">
                    <dt>Média de altura</dt>
                    <dd id="mediaAltura">-</dd>
                </div>
                <div class="resumo-item">
                    <dt>Média de IMC</dt>
                    <dd id="mediaIMC">-</dd>
                </div>
                <div class="resumo-item">
                    <dt>Menor IMC</dt>
                    <dd id="menorIMC">-</dd>
                </div>
                <div class="resumo-item">
                    <dt>Maior IMC</dt>
                    <dd id="maiorIMC">-</dd>
                </div>
            </dl>
        </section>
        <input id="campoPesquisa" class="pesquisa" type="search" placeholder="Pesquisar por nome">
        <p id="semResultados" class="sem-resultados">Nenhuma pessoa encontrada.</p>

        <div id="informacoesCadastro"></div>
        <div id="informacoesCadastro"></div>
    </div>
    <script src="script.js"></script>
</body>

</html>
